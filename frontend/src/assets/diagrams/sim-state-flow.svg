<text x="292" y="76" text-anchor="middle" font-size="13" fill="#0f1219" font-weight="700">fold</text>
<text x="292" y="108" text-anchor="middle" font-size="11" fill="#60739f" >2~3 s / demo</text>
<line x1="559" y1="88" x2="656" y2="88" stroke="#2337ff" stroke-width="2" marker-end="url(#a)"/>
<text x="607" y="76" text-anchor="middle" font-size="13" fill="#0f1219" font-weight="700">restore</text>
<text x="607" y="108" text-anchor="middle" font-size="11" fill="#60739f" >load_state</text>
<rect x="660" y="240" width="210" height="76" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="765.0" y="275.0" text-anchor="middle" font-weight="700" fill="#0f1219">policy rollout</text>
<text x="765.0" y="295.0" text-anchor="middle" font-size="12" fill="#60739f">checkpoint · rewind · reset</text>
<rect x="345" y="240" width="210" height="76" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="450.0" y="275.0" text-anchor="middle" font-weight="700" fill="#0f1219">trajectory</text>
<text x="450.0" y="295.0" text-anchor="middle" font-size="12" fill="#60739f">HDF5 (surviving branch)</text>
<line x1="765" y1="130" x2="765" y2="236" stroke="#2337ff" stroke-width="2" marker-end="url(#a)"/>
<text x="777" y="184" text-anchor="start" font-size="12" fill="#60739f" >run</text>
<line x1="656" y1="278" x2="559" y2="278" stroke="#2337ff" stroke-width="2" marker-end="url(#a)"/>
<text x="607" y="266" text-anchor="middle" font-size="12" fill="#0f1219" >save_trajectory</text>
<line x1="450" y1="236" x2="450" y2="130" stroke="#2337ff" stroke-width="2" marker-end="url(#a)"/>
<text x="462" y="184" text-anchor="start" font-size="12" fill="#60739f" >fold at chosen second</text>
<text x="450" y="356" text-anchor="middle" font-size="13" fill="#0f1219" >start state를 만들고 → 복원해서 실행하고 → 실행 기록에서 다시 start state를 만든다</text>
