<rect x="345" y="50" width="210" height="76" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="450.0" y="85.0" text-anchor="middle" font-weight="700" fill="#0f1219">start state</text>
<text x="450.0" y="105.0" text-anchor="middle" font-size="12" fill="#60739f">HDF5 (per_skill_v3)</text>
<rect x="660" y="50" width="210" height="76" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="765.0" y="85.0" text-anchor="middle" font-weight="700" fill="#0f1219">eval scene</text>
<text x="765.0" y="105.0" text-anchor="middle" font-size="12" fill="#60739f">OmniGibson 3.9.3-post1</text>
