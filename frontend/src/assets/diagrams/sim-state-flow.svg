<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif" font-size="15">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2337ff"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#ffffff" stroke="#e5e9f0"/>
<text x="30" y="26" text-anchor="start" font-size="13" fill="#7c5cff" font-weight="700">Phase A · CPU (simulator 불필요)</text>
<text x="870" y="26" text-anchor="end" font-size="13" fill="#7c5cff" font-weight="700">Phase B · GPU (official evaluator)</text>
