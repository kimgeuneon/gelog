<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2337ff"/></marker></defs>
<rect width="800" height="330" rx="14" fill="#ffffff" stroke="#e5e9f0"/>
<rect x="30" y="40" width="200" height="100" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="130" y="68" text-anchor="middle" font-weight="700" fill="#0f1219">Client</text>
<text x="130" y="104" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="13" fill="#0f1219">query { user {</text>
<text x="130" y="122" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="13" fill="#0f1219">name posts { title } } }</text>
<line x1="234" y1="90" x2="326" y2="90" stroke="#2337ff" stroke-width="2" marker-end="url(#a)"/>
<text x="280" y="76" text-anchor="middle" font-size="13" fill="#0f1219" font-weight="700">POST</text>
<text x="280" y="110" text-anchor="middle" font-size="13" fill="#60739f" >/graphql</text>
<rect x="330" y="50" width="170" height="80" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="415.0" y="86.0" text-anchor="middle" font-weight="700" fill="#0f1219">GraphQL Server</text>
<text x="415.0" y="106.0" text-anchor="middle" font-size="13" fill="#60739f">schema + resolvers</text>
<line x1="504" y1="90" x2="586" y2="90" stroke="#2337ff" stroke-width="2" marker-end="url(#a)"/>
<rect x="590" y="40" width="180" height="50" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="680.0" y="70.0" text-anchor="middle" font-weight="700" fill="#0f1219">User service</text>
<rect x="590" y="100" width="180" height="50" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="680.0" y="130.0" text-anchor="middle" font-weight="700" fill="#0f1219">Posts service</text>
<text x="415" y="168" text-anchor="middle" font-size="13" fill="#60739f" >single endpoint</text>
<line x1="330" y1="200" x2="234" y2="200" stroke="#2337ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="280" y="190" text-anchor="middle" font-size="13" fill="#0f1219" font-weight="700">JSON</text>
<rect x="30" y="170" width="200" height="80" rx="10" fill="#eef0ff" stroke="#2337ff" stroke-width="1.5"/>
<text x="130" y="198" text-anchor="middle" font-weight="700" fill="#0f1219">Response</text>
<text x="130" y="228" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="13" fill="#0f1219">only the requested fields</text>
<text x="400" y="300" text-anchor="middle" font-size="14" fill="#0f1219" >Query  |  Mutation  |  Subscription     ·     strongly-typed schema</text>
</svg>
